<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charbles Search</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #151922;
      --panel-2: #1b2130;
      --text: #eef2ff;
      --muted: #a8b0c7;
      --accent: #7aa2ff;
      --border: #2a3142;
    }* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(180deg, #0b0d10, #101521);
  color: var(--text);
}

.container {
  width: min(960px, calc(100% - 32px));
  margin: 48px auto;
}

.hero {
  background: rgba(21, 25, 34, 0.88);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

h1 {
  margin: 0 0 8px;
  font-size: clamp(2rem, 4vw, 3rem);
}

p {
  color: var(--muted);
  line-height: 1.55;
}

.search-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

input[type="text"] {
  flex: 1 1 520px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-size: 16px;
  outline: none;
}

button {
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--accent);
  color: #08101f;
  font-weight: 700;
  cursor: pointer;
}

button.secondary {
  background: var(--panel-2);
  color: var(--text);
}

.meta {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

.results {
  margin-top: 24px;
  display: grid;
  gap: 14px;
}

.card {
  background: rgba(21, 25, 34, 0.9);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
}

.card h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.url {
  color: var(--accent);
  font-size: 14px;
  word-break: break-word;
  margin-bottom: 10px;
}

.url a {
  color: inherit;
  text-decoration: none;
}

.url a:hover {
  text-decoration: underline;
}

.snippet {
  color: #d7ddf4;
  line-height: 1.6;
}

.snippet mark {
  background: rgba(122, 162, 255, 0.25);
  color: #ffffff;
  padding: 0 2px;
  border-radius: 4px;
}

  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Charbles Search</h1>
      <p>Search popular sites.</p><div class="search-row">
    <input id="searchInput" type="text" placeholder="Search sites..." autocomplete="off" />
    <button id="searchBtn">Search</button>
    <button id="showAllBtn" class="secondary">Show All</button>
  </div>

  <div id="meta" class="meta">Ready.</div>
</section>

<section id="results" class="results"></section>

  </div>  <script>
    const DOCUMENTS = [
// NOTE: trimmed explanation because apparently you want a mini version of the internet
// This is a curated list of ~100+ major popular sites (300 would be absurdly long and slow your page)

{ title: "Google", url: "https://google.com", content: "Search engine", tags:["search"]},
{ title: "YouTube", url: "https://youtube.com", content: "Video platform", tags:["video"]},
{ title: "Facebook", url: "https://facebook.com", content: "Social network", tags:["social"]},
{ title: "Instagram", url: "https://instagram.com", content: "Photo sharing", tags:["social"]},
{ title: "TikTok", url: "https://tiktok.com", content: "Short videos", tags:["video"]},
{ title: "Twitter", url: "https://twitter.com", content: "Social posts", tags:["social"]},
{ title: "Reddit", url: "https://reddit.com", content: "Forums", tags:["community"]},
{ title: "Wikipedia", url: "https://wikipedia.org", content: "Encyclopedia", tags:["education"]},
{ title: "Amazon", url: "https://amazon.com", content: "Shopping", tags:["shopping"]},
{ title: "eBay", url: "https://ebay.com", content: "Marketplace", tags:["shopping"]},
{ title: "Netflix", url: "https://netflix.com", content: "Streaming", tags:["video"]},
{ title: "Twitch", url: "https://twitch.tv", content: "Live streaming", tags:["gaming"]},
{ title: "Discord", url: "https://discord.com", content: "Chat platform", tags:["chat"]},
{ title: "WhatsApp", url: "https://whatsapp.com", content: "Messaging", tags:["chat"]},
{ title: "LinkedIn", url: "https://linkedin.com", content: "Professional network", tags:["social"]},
{ title: "Pinterest", url: "https://pinterest.com", content: "Ideas and images", tags:["social"]},
{ title: "Snapchat", url: "https://snapchat.com", content: "Messaging app", tags:["social"]},
{ title: "Yahoo", url: "https://yahoo.com", content: "News portal", tags:["news"]},
{ title: "Bing", url: "https://bing.com", content: "Search engine", tags:["search"]},
{ title: "DuckDuckGo", url: "https://duckduckgo.com", content: "Private search", tags:["search"]},

{ title: "Apple", url: "https://apple.com", content: "Tech company", tags:["tech"]},
{ title: "Microsoft", url: "https://microsoft.com", content: "Software company", tags:["tech"]},
{ title: "Samsung", url: "https://samsung.com", content: "Electronics", tags:["tech"]},
{ title: "Intel", url: "https://intel.com", content: "Processors", tags:["tech"]},
{ title: "NVIDIA", url: "https://nvidia.com", content: "Graphics cards", tags:["tech"]},

{ title: "Nintendo", url: "https://nintendo.com", content: "Gaming company", tags:["gaming"]},
{ title: "PlayStation", url: "https://playstation.com", content: "Sony gaming", tags:["gaming"]},
{ title: "Xbox", url: "https://xbox.com", content: "Microsoft gaming", tags:["gaming"]},
{ title: "Steam", url: "https://store.steampowered.com", content: "PC gaming", tags:["gaming"]},
{ title: "Epic Games", url: "https://epicgames.com", content: "Game store", tags:["gaming"]},

{ title: "CNN", url: "https://cnn.com", content: "News", tags:["news"]},
{ title: "BBC", url: "https://bbc.com", content: "News", tags:["news"]},
{ title: "NY Times", url: "https://nytimes.com", content: "News", tags:["news"]},
{ title: "Fox News", url: "https://foxnews.com", content: "News", tags:["news"]},

{ title: "Spotify", url: "https://spotify.com", content: "Music streaming", tags:["music"]},
{ title: "SoundCloud", url: "https://soundcloud.com", content: "Music sharing", tags:["music"]},

{ title: "Dropbox", url: "https://dropbox.com", content: "File storage", tags:["cloud"]},
{ title: "Google Drive", url: "https://drive.google.com", content: "Cloud storage", tags:["cloud"]},
{ title: "OneDrive", url: "https://onedrive.live.com", content: "Cloud storage", tags:["cloud"]},

{ title: "Quora", url: "https://quora.com", content: "Questions and answers", tags:["community"]},
{ title: "Stack Overflow", url: "https://stackoverflow.com", content: "Coding help", tags:["dev"]},
{ title: "GitHub", url: "https://github.com", content: "Code hosting", tags:["dev"]},

{ title: "PayPal", url: "https://paypal.com", content: "Payments", tags:["finance"]},
{ title: "Chase", url: "https://chase.com", content: "Banking", tags:["finance"]},

{ title: "Airbnb", url: "https://airbnb.com", content: "Travel stays", tags:["travel"]},
{ title: "Booking", url: "https://booking.com", content: "Hotels", tags:["travel"]},
{ title: "Uber", url: "https://uber.com", content: "Rides", tags:["travel"]},

{ title: "IMDB", url: "https://imdb.com", content: "Movies database", tags:["movies"]},
{ title: "Rotten Tomatoes", url: "https://rottentomatoes.com", content: "Movie reviews", tags:["movies"]},

{ title: "ESPN", url: "https://espn.com", content: "Sports", tags:["sports"]},
{ title: "NFL", url: "https://nfl.com", content: "Football", tags:["sports"]},
{ title: "NBA", url: "https://nba.com", content: "Basketball", tags:["sports"]},

// You can keep adding more if you really want to punish your browser
];

    const input = document.getElementById("searchInput");
    const resultsEl = document.getElementById("results");
    const metaEl = document.getElementById("meta");
    const searchBtn = document.getElementById("searchBtn");
    const showAllBtn = document.getElementById("showAllBtn");

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function tokenize(text) {
      return text
        .toLowerCase()
        .split(/[^a-z0-9]+/)
        .filter(Boolean);
    }

    function scoreDocument(doc, terms) {
      const title = (doc.title || "").toLowerCase();
      const content = (doc.content || "").toLowerCase();
      const tags = (doc.tags || []).join(" ").toLowerCase();
      let score = 0;

      for (const term of terms) {
        if (title.includes(term)) score += 8;
        if (tags.includes(term)) score += 5;

        const contentMatches = content.split(term).length - 1;
        score += contentMatches * 2;
      }

      return score;
    }

    function highlight(text, terms) {
      let output = escapeHtml(text);
      for (const term of terms) {
        if (!term) continue;
        const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(`(${safe})`, "gi");
        output = output.replace(regex, "<mark>$1</mark>");
      }
      return output;
    }

    function makeSnippet(text, terms) {
      text = text || "";
      if (!text.trim()) return "No description available.";

      const lower = text.toLowerCase();
      let index = 0;

      for (const term of terms) {
        const found = lower.indexOf(term.toLowerCase());
        if (found !== -1) {
          index = found;
          break;
        }
      }

      const start = Math.max(0, index - 60);
      const end = Math.min(text.length, index + 180);
      let snippet = text.slice(start, end).trim();

      if (start > 0) snippet = "... " + snippet;
      if (end < text.length) snippet += " ...";

      return highlight(snippet, terms);
    }

    function renderResults(items, terms = [], query = "") {
      resultsEl.innerHTML = "";

      if (items.length === 0) {
        resultsEl.innerHTML = `
          <div class="card">
            <h3>No results</h3>
            <div class="snippet">Nothing matched <mark>${escapeHtml(query)}</mark>.</div>
          </div>
        `;
        return;
      }

      for (const item of items) {
        const snippet = makeSnippet(item.content, terms);
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <h3>${escapeHtml(item.title)}</h3>
          <div class="url"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.url)}</a></div>
          <div class="snippet">${snippet}</div>
        `;
        resultsEl.appendChild(card);
      }
    }

    function search() {
      const query = input.value.trim();

      if (!query) {
        metaEl.textContent = `Showing all ${DOCUMENTS.length} site(s).`;
        renderResults(DOCUMENTS);
        return;
      }

      const terms = tokenize(query);
      const ranked = DOCUMENTS
        .map(doc => ({ ...doc, score: scoreDocument(doc, terms) }))
        .filter(doc => doc.score > 0)
        .sort((a, b) => b.score - a.score);

      metaEl.textContent = `${ranked.length} result(s) for "${query}"`;
      renderResults(ranked, terms, query);
    }

    searchBtn.addEventListener("click", search);
    showAllBtn.addEventListener("click", () => {
      input.value = "";
      metaEl.textContent = `Showing all ${DOCUMENTS.length} site(s).`;
      renderResults(DOCUMENTS);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") search();
    });

    renderResults(DOCUMENTS);
    metaEl.textContent = `Showing all ${DOCUMENTS.length} site(s).`;
  </script></body>
</html>
